name: Deploy to Azure

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-getanewpassword
  cancel-in-progress: false

permissions:
  id-token: write   # OIDC login to Azure, no stored passwords
  contents: read

env:
  AZURE_WEBAPP_NAME: getanewpassword-linux   # change to the production app name at cutover
  PUBLISH_DIR: publish

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish dotnet/GANP.Website/GANP.Website.csproj -c Release -o ${{ env.PUBLISH_DIR }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.PUBLISH_DIR }}

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.deploy.outputs.webapp-url }}/api/generatepassword" || true)
            [ "$code" = "200" ] && echo "OK" && exit 0
            echo "attempt $i: HTTP $code"; sleep 10
          done
          exit 1
